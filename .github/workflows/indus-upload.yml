name: Upload APK to Indus Appstore

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct APK download URL"
        required: true
        type: string
        default: "https://expo.dev/artifacts/eas/V9So0GpyCXu-1zIkLbpDzslEc7LAtw4NxbDrLciOKH0.apk"

      package_name:
        description: "Android package name"
        required: true
        type: string
        default: "com.connectpi.bladerush"

      release_notes:
        description: "Release notes"
        required: false
        type: string
        default: "New release uploaded via GitHub Actions"

jobs:
  upload-to-indus:
    name: Download APK & Upload to Indus
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Download APK from URL
      - name: Download APK
        shell: bash
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -e

          echo "Downloading APK..."

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 600 \
            "$APK_URL" \
            --output app-release.apk

          echo "APK downloaded successfully."

          ls -lh app-release.apk

          echo "Checking APK file..."

          file app-release.apk

          if [ ! -s app-release.apk ]; then
            echo "ERROR: APK file is empty."
            exit 1
          fi

      # 3. Verify APK is actually an Android APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          if unzip -t app-release.apk >/dev/null 2>&1; then
            echo "APK ZIP structure is valid."
          else
            echo "ERROR: Downloaded file is not a valid APK."
            exit 1
          fi

      # 4. Upload APK to Indus Appstore
      - name: Upload APK to Indus Appstore
        uses: indusappstore/appstore-release@v1
        with:
          operation_mode: 'deploy_only'
          file_path: './app-release.apk'
          file_type: 'apk'
          package_name: ${{ inputs.package_name }}
          api_token: ${{ secrets.INDUS_APP_STORE_API_TOKEN }}
          release_notes: ${{ inputs.release_notes }}

      # 5. Cleanup downloaded APK
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f app-release.apk
          echo "Temporary APK removed."
