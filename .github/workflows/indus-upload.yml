name: Upload APK to Indus Appstore

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct APK download URL"
        required: true
        type: string

      package_name:
        description: "Android package name"
        required: true
        type: string
        default: "com.connectpi.bladerush"

jobs:
  upload-to-indus:
    name: Download APK and Upload to Indus
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Download APK
        shell: bash
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          set -euo pipefail

          echo "Downloading APK..."

          curl \
            --location \
            --fail \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 900 \
            "$APK_URL" \
            --output app-release.apk

          echo "Download completed."

          if [ ! -s app-release.apk ]; then
            echo "ERROR: APK file is empty."
            exit 1
          fi

          echo "APK size:"
          ls -lh app-release.apk

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Validating APK..."

          if ! unzip -t app-release.apk >/dev/null 2>&1; then
            echo "ERROR: Downloaded file is not a valid APK/ZIP."
            exit 1
          fi

          echo "APK validation successful."

      - name: Upload APK to Indus Appstore
        shell: bash
        env:
          INDUS_API_TOKEN: ${{ secrets.INDUS_APP_STORE_API_TOKEN }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          set -euo pipefail

          if [ -z "$INDUS_API_TOKEN" ]; then
            echo "ERROR: INDUS_APP_STORE_API_TOKEN secret is not configured."
            exit 1
          fi

          echo "Uploading APK to Indus Appstore..."
          echo "Package: $PACKAGE_NAME"

          RESPONSE_FILE="indus-response.json"

          HTTP_STATUS=$(curl \
            --location \
            --silent \
            --show-error \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --request POST \
            "https://developer-api.indusappstore.com/devtools/apk/upgrade/${PACKAGE_NAME}" \
            --header "accept: application/json" \
            --header "Authorization: ${INDUS_API_TOKEN}" \
            --form "file=@app-release.apk;type=application/vnd.android.package-archive")

          echo ""
          echo "Indus API HTTP Status: $HTTP_STATUS"
          echo "Indus API Response:"
          cat "$RESPONSE_FILE"
          echo ""

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "ERROR: Indus API upload failed."
            exit 1
          fi

          echo "========================================"
          echo "APK uploaded successfully to Indus."
          echo "========================================"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f app-release.apk
          rm -f indus-response.json
          echo "Temporary files cleaned up."
